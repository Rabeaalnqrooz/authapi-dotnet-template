services:
  # =========================================================
  # SQL Server
  # =========================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: authapi-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - authnet
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # =========================================================
  # API
  # =========================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authapi-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"

      FrontendUrl: "${FRONTEND_URL}"

      Jwt__AccessSecret: "${JWT_ACCESS_SECRET}"
      Jwt__RefreshSecret: "${JWT_REFRESH_SECRET}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__AccessExpiresInMinutes: "15"
      Jwt__RefreshExpiresInDays: "7"

      EmailSettings__SmtpServer: "${EMAIL_SMTP_SERVER}"
      EmailSettings__SmtpPort: "${EMAIL_SMTP_PORT}"
      EmailSettings__SenderName: "${EMAIL_SENDER_NAME}"
      EmailSettings__SenderEmail: "${EMAIL_SENDER}"
      EmailSettings__Username: "${EMAIL_USERNAME}"
      EmailSettings__Password: "${EMAIL_PASSWORD}"

      CloudinarySettings__CloudName: "${CLOUDINARY_CLOUD_NAME}"
      CloudinarySettings__ApiKey: "${CLOUDINARY_API_KEY}"
      CloudinarySettings__ApiSecret: "${CLOUDINARY_API_SECRET}"

    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - authnet

networks:
  authnet:
    driver: bridge

volumes:
  sqldata: